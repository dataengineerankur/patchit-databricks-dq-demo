resources:
  jobs:
    retail_orders_pipeline:
      name: patchit-retail-orders
      tags:
        demo: patchit
        domain: retail
      tasks:
        - task_key: ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/pipeline_ingest
            base_parameters:
              pipeline_id: retail_orders
              catalog: ${var.catalog}
              schema: ${var.schema}
              row_count: "5000"
              fail_mode: schema_drift_order_ts
        - task_key: transform
          depends_on:
            - task_key: ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/pipeline_transform
            base_parameters:
              pipeline_id: retail_orders
              catalog: ${var.catalog}
              schema: ${var.schema}
              fail_mode: schema_drift_order_ts
        - task_key: quality_publish
          depends_on:
            - task_key: transform
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${workspace.root_path}/files/notebooks/pipeline_quality_publish
            base_parameters:
              pipeline_id: retail_orders
              catalog: ${var.catalog}
              schema: ${var.schema}
              fail_mode: schema_drift_order_ts

